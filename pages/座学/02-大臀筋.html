<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大臀筋 ｜座学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 :root{--paper:#ffffff;--card:#FFFFFF;--ink:#004aad;--muted:rgba(0, 74, 173, .62);--line:rgba(0, 74, 173, .16);--a:#004aad;--a-soft:rgba(0, 74, 173, .08);--a-deep:#004aad;--shadow:0 18px 40px -28px rgba(0, 74, 173, .28);}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Noto Sans JP",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0, 74, 173, .05),transparent 38%),var(--paper);color:var(--ink);line-height:1.7;padding:40px 22px 70px;-webkit-font-smoothing:antialiased;}
 .wrap{max-width:760px;margin:0 auto}
 .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--a-deep);text-decoration:none;margin-bottom:26px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);transition:border-color .2s ease}
 .back:hover{border-color:var(--a)}
 .kicker{font-family:"Outfit",sans-serif;font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--a-deep);text-transform:uppercase;margin-bottom:12px}
 h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.1}
 h1 .badge{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));border-radius:10px;padding:4px 12px;margin-left:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
 h1 ruby rt{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
 .fig .ttl ruby rt{font-size:10px;font-weight:500;color:var(--muted)}
 .meta{font-size:13px;color:var(--muted);margin-top:10px;margin-bottom:30px}
 .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
 .card h2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
 .card h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a);flex:none}
 .card ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
 .card li{font-size:14px;color:var(--ink);padding-left:16px;position:relative;line-height:1.6}
 .card li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--a)}
 .card li b{font-weight:700}
 .card li .sub{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:500}
 .card p{font-size:14px;color:var(--muted)}
 .ph{color:rgba(0, 74, 173, .5);font-style:italic}

 .figs{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}
 .fig{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);overflow:hidden}
 .imgwrap{position:relative;border-radius:14px;overflow:hidden;background:#1c1c1c}
 .imgwrap img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
 .fig figcaption{padding:14px 8px 6px;text-align:center}
 .fig .ttl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:18px;line-height:1.35}

 /* ―― 画像の右に置く説明ボックス ―― */
 .fig.split .body{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:12px;align-items:stretch}
 /* 画像は右の説明ボックスと同じ高さまで伸びる（黒い余白を出さないため） */
 .fig.split .imgwrap{min-height:240px}
 .fig.split .imgwrap img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
 .sidebox{background:var(--a-soft);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:9px}
 /* 筋肉の名前はこのボックスの見出しとして中に入れる（画像の下には置かない） */
 .sidebox .hd{display:flex;align-items:center;gap:11px;margin-bottom:3px}
 .sidebox .ttl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:19px;line-height:1.3}
 .sidebox p{font-size:13.5px;line-height:1.85;color:var(--ink)}
 .sidebox ruby{white-space:nowrap}  /* ふりがなの途中で改行させない */
 .sidebox ruby rt{font-size:9px;font-weight:500;color:var(--muted)}

 @media(max-width:620px){
  .imgwrap img{aspect-ratio:4/3}
  .fig.split .body{grid-template-columns:1fr}
  .fig.split .imgwrap{min-height:0}
  .fig.split .imgwrap img{position:static;height:auto;aspect-ratio:4/3}
  .sidebox p br{display:none}
 }
</style>
</head>
<body>
<div class="wrap">
 <a class="back" href="../../研修タイムテーブル.html">← 研修タイムテーブルに戻る</a>
 <div class="kicker">解剖学・生理学・運動学 ／ 1.1 筋肉</div>
 <h1><ruby>大臀筋<rt>だいでんきん</rt></ruby><span class="badge">座学</span></h1>
 <div class="meta">No.11 ／ 起始・停止・働きを学ぶ</div>

 <div class="figs">
  <figure class="fig split">
   <div class="body">
    <div class="imgwrap"><img src="../../Picture/筋肉/大殿筋.png" alt="大殿筋"></div>
    <aside class="sidebox">
     <div class="hd"><div class="ttl"><ruby>大殿筋<rt>だいでんきん</rt></ruby></div></div>
     <p><ruby>単体<rt>たんたい</rt></ruby>としては最も大きい筋肉。</p>
     <p><ruby>鍛<rt>きた</rt></ruby>えることで消費カロリーが増え、<ruby>脂肪燃焼<rt>しぼうねんしょう</rt></ruby>しやすい<ruby>身体<rt>からだ</rt></ruby>になる。</p>
    </aside>
   </div>
  </figure>
  <figure class="fig split">
   <div class="body">
    <div class="imgwrap"><img src="../../Picture/筋肉/中殿筋.png" alt="中殿筋"></div>
    <aside class="sidebox">
     <div class="hd"><div class="ttl"><ruby>中殿筋<rt>ちゅうでんきん</rt></ruby></div></div>
     <p>ヒップアップするためにも<br><ruby>鍛<rt>きた</rt></ruby>えておきたい筋肉。</p>
    </aside>
   </div>
  </figure>
  <figure class="fig split">
   <div class="body">
    <div class="imgwrap"><img src="../../Picture/筋肉/小殿筋.png" alt="小殿筋"></div>
    <aside class="sidebox">
     <div class="hd"><div class="ttl"><ruby>小殿筋<rt>しょうでんきん</rt></ruby></div></div>
     <p><ruby>鍛<rt>きた</rt></ruby>えることで<ruby>股関節<rt>こかんせつ</rt></ruby>の安定性アップや<ruby>怪我<rt>けが</rt></ruby>防止になる。</p>
    </aside>
   </div>
  </figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/梨状筋.png" alt="梨状筋"></div><figcaption><div class="ttl"><ruby>梨状筋<rt>りじょうきん</rt></ruby></div></figcaption></figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/上双子筋.png" alt="上双子筋"></div><figcaption><div class="ttl"><ruby>上双子筋<rt>じょうそうしきん</rt></ruby></div></figcaption></figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/下双子筋.png" alt="下双子筋"></div><figcaption><div class="ttl"><ruby>下双子筋<rt>かそうしきん</rt></ruby></div></figcaption></figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/内閉鎖筋.png" alt="内閉鎖筋"></div><figcaption><div class="ttl"><ruby>内閉鎖筋<rt>ないへいさきん</rt></ruby></div></figcaption></figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/外閉鎖筋.png" alt="外閉鎖筋"></div><figcaption><div class="ttl"><ruby>外閉鎖筋<rt>がいへいさきん</rt></ruby></div></figcaption></figure>
  <figure class="fig"><div class="imgwrap"><img src="../../Picture/筋肉/大腿方形筋.png" alt="大腿方形筋"></div><figcaption><div class="ttl"><ruby>大腿方形筋<rt>だいたいほうけいきん</rt></ruby></div></figcaption></figure>
 </div>

 <div class="card"><h2>起始（Origin）</h2><p class="ph">ここに起始を記載します。</p></div>
 <div class="card"><h2>停止（Insertion）</h2><p class="ph">ここに停止を記載します。</p></div>
 <div class="card"><h2>働き（Action）</h2><p class="ph">ここに主な働きを記載します。</p></div>
 <div class="card"><h2>種目</h2>
  <ul>
   <li><b>スクワット</b><span class="sub">大殿筋を中心に下半身全体を鍛える</span></li>
   <li><b>ヒップスラスト</b><span class="sub">大殿筋を集中的に鍛えられる</span></li>
   <li><b>ランジ</b><span class="sub">片脚ずつ大殿筋・中殿筋に効かせる</span></li>
  </ul>
 </div>
 <div class="card"><h2>ポイント・関連知識</h2><p class="ph">代償動作・よくあるエラー・指導時の注意点などを記載します。</p></div>
</div>

</body>
