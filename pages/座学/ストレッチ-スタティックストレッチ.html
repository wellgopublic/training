 .nav a:hover{border-color:var(--a);background:#fff}
 .nav a.is-current{color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));border-color:var(--a-deep)}
 .hero{margin-bottom:24px;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
