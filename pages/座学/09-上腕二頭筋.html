<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上腕二頭筋 ｜座学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 :root{--paper:#ffffff;--card:#FFFFFF;--ink:#004aad;--muted:rgba(0, 74, 173, .62);--line:rgba(0, 74, 173, .16);--a:#004aad;--a-soft:rgba(0, 74, 173, .08);--a-deep:#004aad;--shadow:0 18px 40px -28px rgba(0, 74, 173, .28);--origin:#e5326b;--insert:#0e9bd6;}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Noto Sans JP",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0, 74, 173, .05),transparent 38%),var(--paper);color:var(--ink);line-height:1.7;padding:40px 22px 70px;-webkit-font-smoothing:antialiased;}
 .wrap{max-width:760px;margin:0 auto}
 .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--a-deep);text-decoration:none;margin-bottom:26px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);transition:border-color .2s ease}
 .back:hover{border-color:var(--a)}
 .kicker{font-family:"Outfit",sans-serif;font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--a-deep);text-transform:uppercase;margin-bottom:12px}
 h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.1}
 h1 .badge{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));border-radius:10px;padding:4px 12px;margin-left:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
 h1 ruby rt{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
 .fig .ttl ruby rt{font-size:10px;font-weight:500;color:var(--muted)}
 h1{margin-bottom:30px}

 /* ―― 画像ギャラリー（1段1枚・横長・大きく）―― */
 .figs{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}
 .fig{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);overflow:hidden}
 .imgwrap{position:relative;border-radius:14px;overflow:hidden;background:#1c1c1c}
 .imgwrap img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
 .fig figcaption{padding:14px 8px 6px;text-align:center}
 .fig .num{font-family:"Outfit",sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));border-radius:999px;padding:3px 13px;display:inline-block;margin-bottom:8px}
 .fig .ttl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:18px;line-height:1.35}

 /* ―― 画像の右に置く説明ボックス ―― */
 .fig.split .body{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:12px;align-items:stretch}
 /* 画像は右の説明ボックスと同じ高さまで伸びる（黒い余白を出さないため） */
 .fig.split .imgwrap{min-height:240px}
 .fig.split .imgwrap img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
 .sidebox{background:var(--a-soft);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:9px}
 /* 番号と筋肉の名前はこのボックスの見出しとして中に入れる（画像の下には置かない） */
 .sidebox .hd{display:flex;align-items:center;gap:11px;margin-bottom:3px}
 .sidebox .num{margin-bottom:0;flex:none}
 .sidebox .ttl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:19px;line-height:1.3}
 .sidebox p{font-size:13.5px;line-height:1.85;color:var(--ink)}
 .sidebox .ex{font-size:12.5px;color:var(--muted);line-height:1.7;border-top:1.5px dashed var(--line);padding-top:10px;margin-top:2px}
 .sidebox .ex b{color:var(--ink);font-weight:700}
 .sidebox ruby{white-space:nowrap}  /* ふりがなの途中で改行させない */
 .sidebox ruby rt{font-size:9px;font-weight:500;color:var(--muted)}

 /* ―― 強調カード（起始・停止）―― */
 .keys{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
 .kcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
 .kcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
 .kcard.o::before{background:var(--origin)}.kcard.i::before{background:var(--insert)}
 .kcard h2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:17px;display:flex;align-items:center;gap:9px;margin-bottom:12px}
 .kcard h2 .tag{font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:3px 11px;font-family:"Outfit",sans-serif;letter-spacing:.08em}
 .kcard.o h2 .tag{background:var(--origin)}.kcard.i h2 .tag{background:var(--insert)}
 .kcard ul{list-style:none;display:flex;flex-direction:column;gap:9px}
 .kcard li{font-size:14px;font-weight:500;padding-left:18px;position:relative;color:var(--ink)}
 .kcard li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%}
 .kcard.o li::before{background:var(--origin)}.kcard.i li::before{background:var(--insert)}
 .kcard li b{font-weight:700}
 .kcard li small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}

 /* ―― 通常カード ―― */
 .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
 .card h2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
 .card h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a);flex:none}
 .card ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
 .card li{font-size:14px;color:var(--ink);padding-left:16px;position:relative;line-height:1.6}
 .card li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--a)}
 .card li b{font-weight:700}
 .card li .sub{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:500}
 .card p{font-size:14px;color:var(--ink)}
 .card .ph{color:rgba(0, 74, 173, .5);font-style:italic}

 @media(max-width:620px){
  .imgwrap img{aspect-ratio:4/3}
  .keys{grid-template-columns:1fr}
  .fig.split .body{grid-template-columns:1fr}
  .fig.split .imgwrap{min-height:0}
  .fig.split .imgwrap img{position:static;height:auto;aspect-ratio:4/3}
  .sidebox p br{display:none}
 }
</style>
</head>
<body>
<div class="wrap">
 <a class="back" href="../../研修タイムテーブル.html">← 研修タイムテーブルに戻る</a>
 <div class="kicker">解剖学・生理学・運動学 ／ 1.1 筋肉</div>
 <h1><ruby>上腕二頭筋<rt>じょうわんにとうきん</rt></ruby><span class="badge">座学</span></h1>

 <div class="figs">
  <figure class="fig split">
   <div class="body">
    <div class="imgwrap"><img src="../../Picture/筋肉/上腕二頭筋長頭.png" alt="上腕二頭筋長頭"></div>
    <aside class="sidebox">
     <div class="hd"><div class="ttl"><ruby>上腕二頭筋長頭<rt>じょうわんにとうきんちょうとう</rt></ruby></div></div>
     <p><ruby>紡錘状筋<rt>ぼうすいじょうきん</rt></ruby>なので<ruby>軽<rt>かる</rt></ruby>めの<ruby>重量<rt>じゅうりょう</rt></ruby>で<ruby>高回数<rt>こうかいすう</rt></ruby>で鍛えるのが良い。</p>
     <p>曲げきったときに<ruby>小指<rt>こゆび</rt></ruby>が上にあることで<ruby>最大収縮<rt>さいだいしゅうしゅく</rt></ruby>している。</p>
     <div class="ex"><b>オススメ種目</b><br>
      21 curl … 高回数で行える。<br>
      Incline dumbbell curl … ストレッチが効き<ruby>刺激<rt>しげき</rt></ruby>が入りやすい。</div>
    </aside>
   </div>
  </figure>
  <figure class="fig split">
   <div class="body">
    <div class="imgwrap"><img src="../../Picture/筋肉/上腕二頭筋短頭.png" alt="上腕二頭筋短頭"></div>
    <aside class="sidebox">
     <div class="hd"><div class="ttl"><ruby>上腕二頭筋短頭<rt>じょうわんにとうきんたんとう</rt></ruby></div></div>
     <p><ruby>長頭<rt>ちょうとう</rt></ruby>・<ruby>短頭<rt>たんとう</rt></ruby>のインナーには<br><ruby>上腕筋<rt>じょうわんきん</rt></ruby>が<ruby>存在<rt>そんざい</rt></ruby>する。</p>
     <div class="ex"><b>オススメ種目</b><br>
      上腕筋はプリチャーカールで<ruby>狙<rt>ねら</rt></ruby>いやすい。</div>
    </aside>
   </div>
  </figure>
 </div>

 <div class="keys">
  <div class="kcard o">
   <h2><span class="tag">ORIGIN</span>起始</h2>
   <ul>
    <li><b>長頭</b>：<ruby>関節上結節<rt>かんせつじょうけっせつ</rt></ruby>・<ruby>上方関節唇<rt>じょうほうかんせつしん</rt></ruby></li>
    <li><b>短頭</b>：<ruby>烏口突起<rt>うこうとっき</rt></ruby></li>
   </ul>
  </div>
  <div class="kcard i">
   <h2><span class="tag">INSERTION</span>停止</h2>
   <ul>
    <li><b><ruby>橈骨粗面<rt>とうこつそめん</rt></ruby></b><small>長頭・短頭 共通</small></li>
    <li><b><ruby>前腕屈筋腱<rt>ぜんわんくっきんけん</rt></ruby></b></li>
   </ul>
  </div>
 </div>

 <div class="card"><h2>働き（Action）</h2>
  <ul>
   <li><b><ruby>肩関節<rt>かたかんせつ</rt></ruby></b>：<ruby>屈曲<rt>くっきょく</rt></ruby>・<ruby>水平内転<rt>すいへいないてん</rt></ruby></li>
   <li><b><ruby>肘関節<rt>ひじかんせつ</rt></ruby></b>：<ruby>屈曲<rt>くっきょく</rt></ruby>・<ruby>前腕回外<rt>ぜんわんかいがい</rt></ruby><span class="sub">前腕回外 ＝ 小指を上にする動き</span></li>
  </ul>
 </div>
</div>

</body>
</html>
