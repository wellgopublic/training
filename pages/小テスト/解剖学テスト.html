<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解剖学テスト ｜テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 :root{--paper:#ffffff;--card:#FFFFFF;--ink:#004aad;--muted:rgba(0, 74, 173, .62);--line:rgba(0, 74, 173, .16);--a:#004aad;--a-soft:rgba(0, 74, 173, .08);--a-deep:#004aad;--shadow:0 18px 40px -28px rgba(0, 74, 173, .28);}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Noto Sans JP",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0, 74, 173, .05),transparent 38%),var(--paper);color:var(--ink);line-height:1.7;padding:40px 22px 70px;-webkit-font-smoothing:antialiased;}
 .wrap{max-width:760px;margin:0 auto}
 .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--a-deep);text-decoration:none;margin-bottom:26px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);transition:border-color .2s ease}
 .back:hover{border-color:var(--a)}
 .kicker{font-family:"Outfit",sans-serif;font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--a-deep);text-transform:uppercase;margin-bottom:12px}
 h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.1}
 h1{margin-bottom:30px}
 .q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
 .q .n{font-family:"Outfit",sans-serif;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
 .q .body{flex:1}
 .q .body p.ask{font-size:15px;font-weight:700;color:var(--ink);font-style:normal}
 rt{font-size:.55em;font-weight:500}
 /* 大きな見出し（テストの2つの区分）。この下に .q のカードをならべる */
 .sec{margin-bottom:34px}
 .sec:last-child{margin-bottom:0}
 .sec-h{display:flex;align-items:center;gap:13px;padding-bottom:13px;margin-bottom:16px;border-bottom:2px solid var(--line)}
 .sec-h .sn{font-family:"Outfit",sans-serif;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
 /* 中は「テスト」タグと題名の2つだけ。題名は1つの span にまとめないと、ふりがなごとに間があく */
 .sec-h h2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:21px;line-height:1.35;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
 .sec-h h2 .tag{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:700;color:var(--a-deep);background:var(--a-soft);border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
 <a class="back" href="../../研修タイムテーブル.html">← 研修タイムテーブルに戻る</a>
 <div class="kicker">WEEK 02 ／ DAY 4</div>
 <h1>解剖学テスト</h1>

 <section class="sec">
  <div class="sec-h">
   <span class="sn">1</span>
   <h2><span class="tag">テスト</span><span><ruby>関節<rt>かんせつ</rt></ruby>の<ruby>動<rt>うご</rt></ruby>き</span></h2>
  </div>
 </section>

 <section class="sec">
  <div class="sec-h">
   <span class="sn">2</span>
   <h2><span class="tag">テスト</span><span><ruby>筋肉<rt>きんにく</rt></ruby>の<ruby>位置<rt>いち</rt></ruby>・<ruby>名前<rt>なまえ</rt></ruby></span></h2>
  </div>
 </section>
</div>
</body>
</html>
