<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>広背筋 ｜小テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
 :root{--paper:#ffffff;--card:#FFFFFF;--ink:#004aad;--muted:rgba(0, 74, 173, .62);--line:rgba(0, 74, 173, .16);--a:#004aad;--a-soft:rgba(0, 74, 173, .08);--a-deep:#004aad;--shadow:0 18px 40px -28px rgba(0, 74, 173, .28);}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Noto Sans JP",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0, 74, 173, .05),transparent 38%),var(--paper);color:var(--ink);line-height:1.7;padding:40px 22px 70px;-webkit-font-smoothing:antialiased;}
 .wrap{max-width:760px;margin:0 auto}
 .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--a-deep);text-decoration:none;margin-bottom:26px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);transition:border-color .2s ease}
 .back:hover{border-color:var(--a)}
 .kicker{font-family:"Outfit",sans-serif;font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--a-deep);text-transform:uppercase;margin-bottom:12px}
 h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.1}
 h1 .badge{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));border-radius:10px;padding:4px 12px;margin-left:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
 h1{margin-bottom:30px}
 .q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
 .q .n{font-family:"Outfit",sans-serif;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a-deep));width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
 .q .body{flex:1}
 .q .body p{font-size:14px;color:rgba(0, 74, 173, .5);font-style:italic}
 .actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
 .btn{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:14px;border:none;cursor:pointer;border-radius:12px;padding:12px 26px;box-shadow:var(--shadow);transition:transform .15s ease}
 .btn:active{transform:translateY(1px)}
 .btn-ghost{background:var(--card);color:var(--a-deep);border:1.5px solid var(--line)}
 /* 骨格の絵を指す問題 */
 .q .body p.ask{font-size:15px;font-weight:700;color:var(--ink);font-style:normal;margin-bottom:14px}
 .imgwrap{margin:0 0 14px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#2b2b2b;line-height:0}
 .imgwrap img{width:100%;height:auto;display:block;cursor:zoom-in}
 .imgwrap.missing{background:var(--a-soft);border-style:dashed;line-height:1.7;padding:34px 20px;text-align:center}
 .imgwrap.missing::after{content:"骨格の 画像を Picture/骨格/背面.png に 入れて ください";font-size:13px;font-weight:700;color:var(--muted)}
 .ans{border-top:1.5px dashed var(--line);padding-top:14px}
 .toggle{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:13px;color:var(--a-deep);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:border-color .2s ease}
 .toggle:hover{border-color:var(--a)}
 .ans.is-collapsed .abody{display:none}
 .abody{margin-top:14px;display:grid;gap:10px}
 .row{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:500}
 .chip{flex:none;font-size:12px;font-weight:900;color:#fff;border-radius:8px;padding:2px 11px;margin-top:5px}
 .chip-k{background:#d64545}
 .chip-t{background:#2f9e63}
 rt{font-size:.55em;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
 <a class="back" href="../../研修タイムテーブル.html">← 研修タイムテーブルに戻る</a>
 <div class="kicker">解剖① 筋肉・起始停止</div>
 <h1>広背筋<span class="badge">小テスト</span></h1>

 <div class="q">
  <div class="n">1</div>
  <div class="body">
   <p class="ask"><ruby>広背筋<rt>こうはいきん</rt></ruby>の <ruby>起始<rt>きし</rt></ruby>と <ruby>停止<rt>ていし</rt></ruby>は どこですか。<br>下の 絵の 上を 指して ください。</p>
   <figure class="imgwrap"><img src="../../Picture/骨格/背面.png" alt="骨格 背面 — 広背筋の起始・停止を指す練習"
     onerror="this.parentNode.classList.add('missing');this.remove()"></figure>
   <div class="ans is-collapsed">
    <button type="button" class="toggle" aria-expanded="false"
      onclick="(function(b){var s=b.parentNode;var open=!s.classList.contains('is-collapsed');s.classList.toggle('is-collapsed');b.setAttribute('aria-expanded',String(!open));b.textContent=open?'こたえを 見る':'こたえを 隠す';})(this)">こたえを 見る</button>
    <div class="abody">
     <div class="row"><span class="chip chip-k">起始</span>
      <div>① <ruby>胸椎<rt>きょうつい</rt></ruby>7〜12・<ruby>腰椎<rt>ようつい</rt></ruby>1〜5<br>
       ② <ruby>腸骨稜<rt>ちょうこつりょう</rt></ruby><br>
       ③ <ruby>下部肋骨<rt>かぶろっこつ</rt></ruby><br>
       ④ <ruby>肩甲骨下角<rt>けんこうこつかかく</rt></ruby></div>
     </div>
     <div class="row"><span class="chip chip-t">停止</span>
      <div><ruby>小結節稜<rt>しょうけっせつりょう</rt></ruby></div>
     </div>
    </div>
   </div>
  </div>
 </div>
 <div class="q"><div class="n">2</div><div class="body"><p>設問をここに記載します。</p></div></div>
 <div class="q"><div class="n">3</div><div class="body"><p>設問をここに記載します。</p></div></div>
 <div class="q"><div class="n">4</div><div class="body"><p>設問をここに記載します。</p></div></div>
 <div class="q"><div class="n">5</div><div class="body"><p>設問をここに記載します。</p></div></div>
</div>
<script src="../../assets/zoom.js" defer></script>
</body>
</html>
